<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Lead Capture</title><link rel="stylesheet" href="styles.css"/></head><body><main class="container"><section class="hero"><h1>Join the list</h1><p>We’ll only reach out when it matters.</p></section><section class="card" aria-labelledby="lead-form-title"><h2 id="lead-form-title">Tell us how to reach you</h2><form id="lead-form" novalidate><div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" required aria-required="true"/><small class="error" id="name-error" role="alert"></small></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required aria-required="true"/><small class="error" id="email-error" role="alert"></small></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" inputmode="tel" placeholder="+1 (555) 123-4567" required aria-required="true"/><small class="error" id="phone-error" role="alert"></small></div><button type="submit" id="submit-btn">Notify me</button><p id="form-status" class="status" aria-live="polite"></p></form><p class="fineprint">By submitting, you agree we may contact you about updates. You can opt out anytime.</p></section></main><script src="script.js" defer></script></body></html>
